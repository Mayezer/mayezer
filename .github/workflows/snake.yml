
name: Generate Snake

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mayezer
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
